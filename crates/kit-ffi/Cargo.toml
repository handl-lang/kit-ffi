[package]
name = "handl-kit-ffi"
version = "0.1.0"
edition = "2024"
description = "FFI kit — the `ffi` handl module (`ffi.hnl` + native ops over handl-plugin-ffi, or stubs)."
license.workspace = true
repository.workspace = true

# The `ffi` handl module always resolves; the `ffi` feature only flips
# whether the native ops are real (`handl-plugin-ffi` — cranelift +
# libloading) or the graceful-degradation stubs (capability ops raise,
# `ffi.load`/`ffi.sym` probes return `{__tag__: "err"}` so dependent
# packages fall back instead of propagating). Replaces the old
# `handl-kit-prelude/ffi` feature (ADR-0128 §0.9).
[features]
default = ["ffi"]
ffi = ["dep:handl-plugin-ffi"]

[dependencies]
handl-kit-core = { git = "https://github.com/handl-lang/kit-core", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ffi = { git = "https://github.com/handl-lang/kit-ffi", branch = "main", optional = true }
serde_json = "1"

